:root{--g:#1f4d36;--on:#fff;--bg:#f6f1e7;--cd:#fffdf8;--tx:#1d2a22;--mu:#6b7468;--bd:#e4dccb;--ac:#c8a24a;--rd:#b3412f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--g:#7fc79b;--on:#0e1a12;--bg:#121a15;--cd:#1b251e;--tx:#ecefe6;--mu:#9aa79a;--bd:#2c3a30;--rd:#e07a67}}
:root[data-theme="dark"]{--g:#7fc79b;--on:#0e1a12;--bg:#121a15;--cd:#1b251e;--tx:#ecefe6;--mu:#9aa79a;--bd:#2c3a30;--rd:#e07a67}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,"Segoe UI",Tahoma,sans-serif}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--g);color:var(--on)}
header b{font-size:19px;letter-spacing:.5px}header small{display:block;opacity:.8;font-size:11px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:var(--bg);border-bottom:1px solid var(--bd)}
nav button{flex:none;border:1px solid var(--bd);background:var(--cd);color:var(--tx);padding:7px 13px;border-radius:20px;font:inherit;cursor:pointer}
nav button.on{background:var(--g);color:var(--on);border-color:var(--g)}
main{max-width:980px;margin:0 auto;padding:14px 14px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px;animation:in .3s}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.st b{display:block;font-size:24px;color:var(--g)}.st span{color:var(--mu);font-size:13px}
h3{margin:0 0 8px;font-size:16px}.mu{color:var(--mu);font-size:13px}.bad{color:var(--rd)}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:3px}
input,select,textarea{font:inherit;padding:8px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx);min-width:0}
.btn{border:0;background:var(--g);color:var(--on);padding:9px 16px;border-radius:10px;font:inherit;cursor:pointer;align-self:end}
.btn.s{background:var(--bd);color:var(--tx);padding:4px 10px;font-size:12px;margin-inline-end:4px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13.5px}th,td{text-align:start;padding:7px 6px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-weight:600}
.ph{width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--bd)}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;background:var(--bd);font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
</style></head><body>

else if(i.id=='pf'){const f=i.files[0];if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=96;const x=c.getContext('2d'),s=Math.min(im.width,im.height);x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,96,96);PH=c.toDataURL('image/jpeg',.7)};im.src=URL.createObjectURL(f)}});

document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,o=Object.fromEntries(new FormData(f)),n=k=>+o[k]||0,bad=()=>{alert(t('err'));return 1},id=f.id;
if(id=='fa'){if(!o.name.trim()||!o.no.trim())return bad();const c=D.animals.find(x=>x.id==E&&E);if(D.animals.some(x=>x.no==o.no&&x.id!=E))return bad();const a={id:c?c.id:uid(),no:o.no.trim(),name:o.name.trim(),breed:o.breed,dob:o.dob,weight:n('weight'),price:n('price'),status:o.status,hs:o.hs,notes:o.notes,ph:PH||(c&&c.ph)||'',arch:c?c.arch:false};if(c)Object.assign(c,a);else D.animals.push(a);E=null;PH=''}
else if(id=='fr'){if(!o.aid||!o.date)return bad();D.repro.push({id:uid(),aid:o.aid,type:o.type,date:o.date,bull:o.bull,conf:!!o.conf,calv:o.calv})}
else if(id=='fm'){if(!o.aid||!o.date||(n('am')<=0&&n('pm')<=0))return bad();const x=D.milk.find(y=>y.date==o.date&&y.aid==o.aid);if(x){x.am=n('am');x.pm=n('pm')}else D.milk.push({date:o.date,aid:o.aid,am:n('am'),pm:n('pm')})}
else if(id=='ff'){if(n('qty')<=0)return bad();D.flog.push({id:uid(),date:o.date,ft:+o.ft,act:o.act,qty:n('qty'),cost:n('cost')});if(o.act=='buy'&&n('cost')>0)D.fin.push({id:uid(),date:o.date,kind:'out',cat:'c_feed',amt:n('cost'),note:t('f'+o.ft)})}
else if(id=='fh'){if(!o.aid||!o.date)return bad();D.health.push({id:uid(),aid:o.aid,type:o.type,title:o.title,date:o.date,wd:n('wd')})}
else if(id=='fn'){if(n('amt')<=0)return bad();D.fin.push({id:uid(),date:o.date,kind:o.kind,cat:o.cat,amt:n('amt'),note:o.note})}
sv();draw()});
draw();
